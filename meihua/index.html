<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매화역수 점괘</title>
  <link rel="stylesheet" href="style.css?v=2026102302">
  <script src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar@0.3.6/dist/korean-lunar-calendar.min.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>매화역수 <span class="han">梅花易數</span></h1>
    <p class="lead">숫자 두 개를 떠올리거나, 지금 이 순간의 시각으로 괘를 뽑아 보세요.</p>

    <form id="meihua-form">
      <label>첫째 수 <input name="a" type="number" min="1" required></label>
      <label>둘째 수 <input name="b" type="number" min="1" required></label>
      <button type="submit">숫자로 점치기</button>
      <button type="button" class="ghost" data-now>지금 시각으로</button>
    </form>

    <section id="meihua-result" hidden aria-live="polite"></section>

    <div class="help">
      <p><strong>외부에서 호출하기</strong></p>
      <p>숫자로: <code>meihua/?a=12&amp;b=34</code></p>
      <p>지금 시각으로: <code>meihua/?t=now</code></p>
      <p>다른 블로그에 넣기: <code>&lt;iframe src="…/meihua/embed.html?t=now" width="100%" height="520"&gt;&lt;/iframe&gt;</code></p>
    </div>
  </main>
  <script type="module">
    import { mount } from './widget.js?v=2026102302';
    mount({ result: document.getElementById('meihua-result'), form: document.getElementById('meihua-form') });
  </script>
</body>
</html>
