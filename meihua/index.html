<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매화역수 점괘</title>
  <link rel="stylesheet" href="style.css?v=2026102309">
  <script src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar@0.3.6/dist/korean-lunar-calendar.min.js"></script>
</head>
<body>
  <main class="wrap">
    <a class="back-blog" id="back-blog" href="https://blog.naver.com/tajanx" hidden>← 블로그로 돌아가기</a>
    <h1>매화역수 <span class="han">梅花易數</span></h1>
    <p class="lead">숫자 두 개를 떠올리거나, 지금 이 순간의 시각으로 괘를 뽑아 보세요.</p>

    <form id="meihua-form">
      <label>첫째 수 <input name="a" type="number" min="1" required></label>
      <label>둘째 수 <input name="b" type="number" min="1" required></label>
      <button type="submit">숫자로 점치기</button>
      <button type="button" class="ghost" data-now>지금 시각으로</button>
    </form>

    <section id="meihua-result" hidden aria-live="polite"></section>

    <details class="help">
      <summary>외부에서 호출하기</summary>
      <p>숫자로: <code>meihua/?a=12&amp;b=34&amp;h=7</code> (h = 시진 번호 子=1~亥=12, 생략하면 지금 시각)</p>
      <p>지금 시각으로: <code>meihua/?t=now</code></p>
      <p>다른 블로그에 넣기: <code>&lt;iframe src="…/meihua/embed.html?t=now" width="100%" height="520"&gt;&lt;/iframe&gt;</code></p>
    </details>
  </main>
  <script>
    // 블로그 글의 링크(?from=blog 또는 네이버 블로그에서 온 경우)로 열리면,
    // 넓은 화면에서도 작은 카드처럼 보이게 하고 '블로그로 돌아가기'를 보여 준다.
    (() => {
      const fromBlog = new URLSearchParams(location.search).get('from') === 'blog' || /blog\.naver\.com/.test(document.referrer);
      if (!fromBlog) return;
      document.body.classList.add('card');
      document.querySelector('.help')?.remove();
      const back = document.getElementById('back-blog');
      back.hidden = false;
      back.addEventListener('click', (e) => {
        e.preventDefault();
        window.close();
        setTimeout(() => {
          if (history.length > 1) history.back();
          else location.href = document.referrer || back.href;
        }, 300);
      });
    })();
  </script>
  <script type="module">
    import { mount } from './widget.js?v=2026102307';
    mount({ result: document.getElementById('meihua-result'), form: document.getElementById('meihua-form') });
  </script>
</body>
</html>
